<!DOCTYPE html>
<html>

<head>
  <title>Checkout Demo — No Real Purchases</title>

  <!-- This code is needed for responsive design to work.
      (Responsive design = make the website look good on
      smaller screen sizes like a phone or a tablet). -->
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles/shared/general.css">
  <link rel="stylesheet" href="styles/pages/checkout/checkout-header.css">
  <link rel="stylesheet" href="styles/pages/checkout/checkout.css">
  <link rel="stylesheet" href="styles/shared/demo-notice.css">
</head>

<body>
  <div class="demo-shell">
    <aside class="demo-notice" aria-label="Educational demonstration notice">
      <div>
        <p><strong>Educational demo by Saikat Ghosh.</strong> Not affiliated with Amazon.</p>
        <p>Simulated shopping only. No real purchases or payments. Do not enter personal or payment information.</p>
      </div>
      <a href="https://github.com/saikat-ghosh-in/amazon-replica" target="_blank" rel="noopener noreferrer">View project source</a>
    </aside>
  <div class="checkout-header js-checkout-header"></div>
  </div>

  <div class="main js-checkout-main">
    <div class="page-title">Review your demo order</div>
    <div class="checkout-grid">
      <div class="order-summary js-order-summary"></div>
      <div class="payment-summary js-payment-summary"></div>
    </div>
  </div>
  <script type="module" src="scripts/checkout.js"></script>
</body>

</html>
